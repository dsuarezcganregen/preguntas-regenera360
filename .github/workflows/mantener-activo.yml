# Supabase pausa los proyectos gratis después de una semana con poca actividad.
# Esta tarea hace una consulta pequeña dos veces al día para que nunca se duerma.
#
# GitHub, a su vez, apaga las tareas programadas de un repositorio público si pasan
# 60 días sin cambios. Por eso, el día 1 de cada mes la tarea deja una nota de fecha
# en el repositorio: así nunca se queda 60 días quieto, ni en las semanas entre
# una generación y otra.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 * * *"   # 7:17 am hora del centro de México
    - cron: "17 1 * * *"    # 7:17 pm hora del centro de México
    - cron: "23 14 1 * *"   # día 1 de cada mes, 8:23 am: nota mensual
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "https://hpbogmqxigglrkixgyfr.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_tfbH95k-GbYsJNmL6KLRvA_hxNKaufk" \
            -H "Content-Type: application/json" \
            -d '{}'

  nota-mensual:
    if: github.event.schedule == '23 14 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dejar la nota de fecha
        run: |
          date -u +"Última revisión automática: %Y-%m-%d %H:%M UTC" > .github/ultima-revision.txt
          git config user.name "Tarea mensual"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-revision.txt
          git commit -m "Nota mensual para que GitHub no apague la tarea diaria"
          git push
